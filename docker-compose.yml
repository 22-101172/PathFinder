version: '3.9'

services:

  neo4j:
    image: neo4j:5
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
    volumes:
      - neo4j_data:/data
      - ./kg_engine/data:/import   # KG CSV files go here
    ports:
      - "7474:7474"   # Neo4j browser
      - "7687:7687"   # Bolt protocol
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10

  kg-engine:
    build: ./kg_engine
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
    expose:
      - "8001"
    depends_on:
      neo4j:
        condition: service_healthy

  rag-engine:
    build: ./rag_engine
    expose:
      - "8002"

  gateway:
    build: ./gateway
    environment:
      - KG_ENGINE_URL=http://kg-engine:8001
      - RAG_ENGINE_URL=http://rag-engine:8002
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_MODEL=${LLM_MODEL}
      - SESSION_STORE=${SESSION_STORE:-memory}
    volumes:
      # Mount student profile as read-only — never overwrite from inside container
      - ./gateway/data/student_profile.json:/app/data/student_profile.json:ro
    ports:
      - "8000:8000"
    depends_on:
      - kg-engine
      - rag-engine

  ui:
    build: ./ui
    environment:
      - GATEWAY_URL=http://gateway:8000
    ports:
      - "3000:3000"
    depends_on:
      - gateway

volumes:
  neo4j_data:
