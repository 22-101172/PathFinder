services:
  neo4j:
    image: neo4j:5
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
    volumes:
      - neo4j_data:/data
      - ./engines/kg/data:/import
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_MODEL=${LLM_MODEL}
      - COLAB_LLM_URL=${COLAB_LLM_URL}
      - SESSION_STORE=${SESSION_STORE:-memory}
    volumes:
      - ./data/student_profile.json:/app/data/student_profile.json:ro
    ports:
      - "8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy

  ui:
    build: ./ui
    environment:
      - GATEWAY_URL=http://gateway:8000
    ports:
      - "3000:3000"
    depends_on:
      - gateway

volumes:
  neo4j_data:
